[project]
name = "gsm-sim"
version = "0.1.0"
description = "Twin-world ride-hailing simulator cho AI advisor thu nhập tài xế Xanh SM (pilot Đống Đa)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1",
    "h3>=4.1",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15.0",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "scipy>=1.12",
]

[project.scripts]
gsm-sim = "gsm_sim.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
viz = ["streamlit>=1.35", "pydeck>=0.9", "plotly>=5.20", "pandas>=2.0"]
# Live LLM composer (C6) — CHỈ cần khi chạy pipeline llm_mode="live"/smoke; test-suite
# deterministic KHÔNG cần. Dùng JSON-mode thuần (không instructor) để tối thiểu deps.
llm = ["openai>=1.30"]
# Data catalog xlsx export (scripts/build_data_catalog.py) — CSV luôn sinh bằng stdlib;
# .xlsx cần openpyxl. Không ảnh hưởng test-suite.
catalog = ["openpyxl>=3.1"]
# Track UI (ui/backend) — FastAPI gateway phục vụ web + Flutter; test dùng httpx TestClient.
ui = ["fastapi>=0.111", "uvicorn>=0.30", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_sim", "src/gsm_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
