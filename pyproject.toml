[project]
name = "gsm-sim"
version = "0.1.0"
description = "Twin-world ride-hailing simulator cho AI advisor thu nhập tài xế Xanh SM (pilot Đống Đa)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1",
    "h3>=4.1",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15.0",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.scripts]
gsm-sim = "gsm_sim.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
viz = ["streamlit>=1.35", "pydeck>=0.9", "plotly>=5.20", "pandas>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_sim", "src/gsm_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
